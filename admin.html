<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ski Router — Admin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
  <div class="snowfall" aria-hidden="true"></div>
  <div class="header-inner">
    <div class="logo">Ski<span>Route</span>r</div>
    <div class="tagline">Manage ski areas</div>
  </div>
</header>

<main>

  <a class="back-link" href="index.html">← Back to the planner</a>

  <div class="card" id="status-card" style="display:none">
    <div id="status-message"></div>
  </div>

  <!-- Existing areas -->
  <div class="card">
    <div class="card-title">📂 Existing areas</div>
    <div id="area-manage-list">
      <div class="area-loading">Loading areas…</div>
    </div>
  </div>

  <!-- Add new area -->
  <div class="card">
    <div class="card-title">➕ Add a new area</div>
    <form id="new-area-form">
      <label class="field-label" for="new-id">Id (unique, e.g. "silvretta")</label>
      <input class="field-input" id="new-id" name="id" type="text" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="my-area" required>

      <label class="field-label" for="new-name">Name</label>
      <input class="field-input" id="new-name" name="name" type="text" placeholder="Silvretta Montafon" required>

      <label class="field-label" for="new-subtitle">Subtitle</label>
      <input class="field-input" id="new-subtitle" name="subtitle" type="text" placeholder="Gaschurn · Schruns · St. Gallenkirch">

      <div class="field-row">
        <div>
          <label class="field-label" for="new-km">Pistes (km)</label>
          <input class="field-input" id="new-km" name="pistesKm" type="number" min="0" placeholder="233">
        </div>
        <div>
          <label class="field-label" for="new-liften">Lifts</label>
          <input class="field-input" id="new-liften" name="liften" type="number" min="0" placeholder="58">
        </div>
        <div>
          <label class="field-label" for="new-hoogte">Altitude</label>
          <input class="field-input" id="new-hoogte" name="hoogte" type="text" placeholder="800–2000 m">
        </div>
      </div>

      <label class="field-label" for="new-file">Dataset (.json)</label>
      <input class="field-input" id="new-file" name="file" type="file" accept="application/json,.json" required>
      <div class="field-hint">
        Expects a direct <code>skimap-osm</code> export: a JSON file with <code>liften</code>
        and <code>pistes</code>, linked by lift codes (<code>beginBovenBij</code>, <code>bereikbareLiften</code>) —
        not by place name. See <code>data/kitzski-osm.json</code> for the structure.
      </div>

      <button class="plan-btn" type="submit">ADD AREA</button>
    </form>
  </div>

</main>

<script src="admin.js"></script>
</body>
</html>
