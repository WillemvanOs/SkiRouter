# Daily: fetch mountain restaurants and huts for European ski areas from
# OpenStreetMap (tools/fetch-pois.mjs) into data/pois/europe.json, and the
# peaks, towns and villages for the route map into data/pois/landmarks.json
# (and into the hand-curated area files), and commit them when they changed.
# The public Overpass servers are often busy, so each run works for a limited
# time (restaurants up to 70 minutes, landmarks the rest) on the areas fetched longest ago
# (restaurants fetched in the last 6 days and landmarks in the last 30 are
# skipped) and saves what it got. On main the site is then redeployed, so the
# areas built at deploy time get the new data. A commit made with
# GITHUB_TOKEN does not start other workflows, hence the explicit deploy job.
#
# Runs by hand too (Actions → "Fetch mountain restaurants" → Run workflow),
# and on a push to another branch that changes the script or this workflow:
# then it commits there, without a deploy.
name: Fetch mountain restaurants

on:
  schedule:
    - cron: '23 3 * * *'   # daily 03:23 UTC
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - tools/fetch-pois.mjs
      - tools/lib/landmarks.mjs
      - .github/workflows/pois.yml

permissions:
  contents: write

concurrency:
  group: pois-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Date
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: /tmp/openskidata
          key: openskidata-${{ steps.date.outputs.day }}

      - name: Build the areas (for their runs and stations)
        run: node tools/build-areas.mjs --europe --out build/europe

      - name: Fetch restaurants and huts
        env:
          BUDGET_MIN: 70
        run: |
          echo "POIS_START=$(date +%s)" >> "$GITHUB_ENV"
          node tools/fetch-pois.mjs --areas build/europe/areas --out data/pois/europe.json

      # The time the restaurants left (at least 20 minutes).
      - name: Fetch peaks, towns and villages
        run: |
          left=$(( 88 - ($(date +%s) - POIS_START) / 60 ))
          BUDGET_MIN=$(( left > 20 ? left : 20 )) node tools/fetch-pois.mjs --kind landmarks --areas build/europe/areas

      - name: Commit when changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/pois data/*.json
          git commit -m "Update mountain restaurants and landmarks"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
