# Daily: pick the mountain restaurants and huts for European ski areas out
# of our own OpenStreetMap extract (tools/fetch-pois.mjs) into
# data/pois/europe.json, and the peaks, towns and villages for the route map
# into data/pois/landmarks.json (and into the hand-curated area files), and
# commit them when they changed.
#
# The extract (tools/osm-extract.sh) holds the Geofabrik regions with ski
# areas, cut down with osmium to what SkiRouter uses. It is made once a week
# and kept in the Actions cache in between, so Geofabrik is asked once a
# week and the public Overpass API not at all (it asks commercial users to
# run their own). On main the site is then redeployed, so the areas built at
# deploy time get the new data. A commit made with GITHUB_TOKEN does not
# start other workflows, hence the explicit deploy job.
#
# Runs by hand too (Actions → "Fetch mountain restaurants" → Run workflow),
# and on a push to another branch that changes the scripts or this workflow:
# then it commits there, without a deploy.
name: Fetch mountain restaurants

on:
  schedule:
    - cron: '23 3 * * *'   # daily 03:23 UTC
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - tools/fetch-pois.mjs
      - tools/osm-extract.sh
      - tools/osm-regions.mjs
      - tools/lib/osm-local.mjs
      - tools/lib/landmarks.mjs
      - .github/workflows/pois.yml

permissions:
  contents: write

concurrency:
  group: pois-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Date
        id: date
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: /tmp/openskidata
          key: openskidata-${{ steps.date.outputs.day }}

      - name: Build the areas (for their runs and stations)
        run: node tools/build-areas.mjs --europe --out build/europe

      # The OpenStreetMap extract: made again once a week.
      - uses: actions/cache@v4
        id: osm
        with:
          path: /tmp/osm
          key: osm-extract-${{ steps.date.outputs.week }}

      - name: Make the OpenStreetMap extract
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          tools/osm-extract.sh /tmp/osm/europe.geojsonseq build/europe/areas

      - name: Restaurants and huts
        run: node tools/fetch-pois.mjs --osm /tmp/osm/europe.geojsonseq --areas build/europe/areas --out data/pois/europe.json

      - name: Peaks, towns and villages
        run: node tools/fetch-pois.mjs --kind landmarks --osm /tmp/osm/europe.geojsonseq --areas build/europe/areas

      - name: Commit when changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/pois data/*.json
          git commit -m "Update mountain restaurants and landmarks"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
