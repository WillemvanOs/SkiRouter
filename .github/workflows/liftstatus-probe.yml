# Live lift status for Europe, phase 1: which ski areas publish lift status
# through a provider we can read (Infosnow, Lumiplan, Micado, …), and how well
# the provider's lift names match our lifts. Writes data/build/liftstatus/
# (probe.md, probe.json, sample pages) and commits it to the branch it ran on.
#
# Runs by hand (Actions → "Probe lift status sources" → Run workflow), and on
# a push to another branch that changes the script or this workflow.
name: Probe lift status sources

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - tools/probe-liftstatus.mjs
      - .github/workflows/liftstatus-probe.yml

permissions:
  contents: write

concurrency:
  group: liftstatus-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Date
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: /tmp/openskidata
          key: openskidata-${{ steps.date.outputs.day }}

      - name: Build the areas (for their lift names)
        run: node tools/build-areas.mjs --europe --out build/europe

      - name: HTML parser
        run: npm install --no-save --no-package-lock cheerio@1

      - name: Probe
        run: node tools/probe-liftstatus.mjs --areas build/europe --out data/build/liftstatus

      - name: Commit
        if: always()
        run: |
          [ -d data/build/liftstatus ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/build/liftstatus
          git diff --cached --quiet && exit 0
          git commit -m "Lift status probe results"
          git pull --rebase
          git push
